<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Messenger | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/socket.io/socket.io.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; height: 100vh; display: flex; background: #f0f2f5; color: #1c1e21; }

    /* ========== SIDEBAR (MESSAGE BAR) ========== */
    .sidebar {
      width: 320px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 20px 15px;
      background: #0084ff;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-search {
      padding: 10px;
      background: #f0f2f5;
    }

    .user-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-user {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }

    .chat-user:hover { background: #f5f6f7; }
    
    .avatar-container {
      position: relative;
      margin-right: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background: #e4e6eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #050505;
    }

    /* Green and Red Dots */
    .status-dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 2px;
      border: 2px solid white;
    }

    .online { background-color: #31a24c; } /* Green */
    .offline { background-color: #bec3c9; } /* Grayish-Red */

    .user-info { flex: 1; }
    .user-info .name { font-weight: 600; font-size: 0.95rem; }
    
    .badge {
      background: #fa3e3e;
      color: white;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
    }

    /* ========== CHAT AREA ========== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      background: #fff;
    }

    .messages {
      flex: 1;
      padding: 20px;
      background: #f0f2f5;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 65%;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .left { background: #e4e6eb; align-self: flex-start; color: #050505; }
    .right { background: #0084ff; align-self: flex-end; color: white; }

    .input-box {
      padding: 15px;
      display: flex;
      align-items: center;
      border-top: 1px solid #ddd;
    }

    .input-box input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
      background: #f0f2f5;
    }

    .send-btn {
      margin-left: 10px;
      background: none;
      border: none;
      color: #0084ff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8a8d91;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <div class="sidebar-header">
    <span>Messages</span>
    <i class="bi bi-box-arrow-right" style="cursor:pointer" onclick="logout()"></i>
  </div>
  
  <div class="user-search">
    <input type="text" placeholder="Search Messenger">
  </div>

  <div class="users-list" id="usersList">
    </div>
</div>

<div class="chat-area">
  <div id="activeChatUI" style="display: none; flex-direction: column; height: 100%;">
    <div class="chat-header">
      <div class="avatar" id="headerAvatar" style="width: 35px; height: 35px; margin-right: 10px;"></div>
      <span id="chatTitle" style="font-weight: bold;"></span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-box">
      <input id="messageInput" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>

  <div id="emptyState" class="empty-state">
    <i class="bi bi-chat-dots" style="font-size: 4rem; margin-bottom: 10px;"></i>
    <p>Select a contact to start chatting</p>
  </div>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", { transports: ["websocket"] });
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  
  if (!loggedUser) {
    location.href = "index.html";
  }

  socket.emit("join", { email: loggedUser.email });

  let activeUser = null;
  let unreadCount = {};

  // 1. Fetch Users and display in Sidebar
  function loadSidebar() {
    fetch(`/api/chat/users/${loggedUser.email}`)
      .then(res => res.json())
      .then(users => {
        const list = document.getElementById("usersList");
        list.innerHTML = "";
        
        users.forEach(user => {
          const email = user.email;
          const name = user.firstName || email;
          const initial = name.charAt(0).toUpperCase();

          const div = document.createElement("div");
          div.className = "chat-user";
          div.id = `user-row-${email}`;
          div.innerHTML = `
            <div class="avatar-container">
              <div class="avatar">${initial}</div>
              <div class="status-dot offline" id="dot-${email}"></div>
            </div>
            <div class="user-info">
              <div class="name">${name}</div>
            </div>
            <div id="badge-${email}" class="badge" style="display:none">0</div>
          `;
          div.onclick = () => openChat(email, name);
          list.appendChild(div);
        });
      });
  }

  // 2. Real-time Status Update (Green/Red Dots)
  socket.on("live_users_list", onlineEmails => {
    // Reset sabko offline
    document.querySelectorAll('.status-dot').forEach(dot => {
      dot.classList.remove("online");
      dot.classList.add("offline");
    });
    
    // Jo online hain unhe green karo
    onlineEmails.forEach(email => {
      const dot = document.getElementById(`dot-${email}`);
      if (dot) {
        dot.classList.add("online");
        dot.classList.remove("offline");
      }
    });
  });

  function openChat(email, name) {
    activeUser = email;
    document.getElementById("emptyState").style.display = "none";
    document.getElementById("activeChatUI").style.display = "flex";
    document.getElementById("chatTitle").innerText = name;
    document.getElementById("headerAvatar").innerText = name.charAt(0).toUpperCase();
    document.getElementById("messages").innerHTML = "";
    
    // Unread count reset
    unreadCount[email] = 0;
    const badge = document.getElementById(`badge-${email}`);
    if(badge) badge.style.display = "none";

    socket.emit("mark_read", { userEmail: loggedUser.email, otherEmail: email });

    // Fetch History
    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(msgs => {
        msgs.forEach(m => appendMessage(m.message, m.senderEmail === loggedUser.email ? "right" : "left"));
        scrollToBottom();
      });
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg || !activeUser) return;

    socket.emit("send_message", { senderEmail: loggedUser.email, receiverEmail: activeUser, message: msg });
    appendMessage(msg, "right");
    input.value = "";
    scrollToBottom();
  }

  socket.on("receive_message", data => {
    if (data.senderEmail === activeUser) {
      appendMessage(data.message, "left");
      scrollToBottom();
    } else {
      // Sidebar notifications
      unreadCount[data.senderEmail] = (unreadCount[data.senderEmail] || 0) + 1;
      const badge = document.getElementById(`badge-${data.senderEmail}`);
      if(badge) {
        badge.innerText = unreadCount[data.senderEmail];
        badge.style.display = "inline-block";
      }
    }
  });

  function appendMessage(text, side) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
  }

  function scrollToBottom() {
    const m = document.getElementById("messages");
    m.scrollTop = m.scrollHeight;
  }

  function logout() {
    localStorage.clear();
    location.href = "index.html";
  }

  // Initial Load
  loadSidebar();
  
  // Refresh users list if a new user joins
  socket.on("sidebar_update", () => loadSidebar());

</script>

</body>
</html>
