<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: #f0f2f5;
    }

    /* ===== LEFT USER LIST ===== */
    .users {
      width: 25%;
      background: #ffffff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
    }

    .users h3 {
      padding: 15px;
      margin: 0;
      background: #667eea;
      color: white;
    }

    .user {
      padding: 12px 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .user:hover {
      background: #f5f5f5;
    }

    .online-dot {
      height: 8px;
      width: 8px;
      background: green;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    /* ===== CHAT AREA ===== */
    .chat {
      width: 75%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #667eea;
      color: white;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      clear: both;
    }

    .left {
      background: #fff;
      float: left;
    }

    .right {
      background: #dcf8c6;
      float: right;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- LEFT: USERS -->
  <div class="users">
    <h3>Online Users</h3>
    <div id="usersList"></div>
  </div>

  <!-- RIGHT: CHAT -->
  <div class="chat">
    <div class="chat-header" id="chatHeader">
      Select a user to chat
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();

    // 🔥 TEMP USER (replace with login data)
    const currentUser = {
      email: localStorage.getItem("email") || prompt("Enter your email")
    };

    localStorage.setItem("email", currentUser.email);

    let selectedUser = null;

    // JOIN SOCKET
    socket.emit("join", currentUser);

    // LIVE USERS LIST
    socket.on("live_users_list", (users) => {
      const usersList = document.getElementById("usersList");
      usersList.innerHTML = "";

      users.forEach((email) => {
        if (email !== currentUser.email) {
          const div = document.createElement("div");
          div.className = "user";
          div.innerHTML = `<span class="online-dot"></span>${email}`;
          div.onclick = () => selectUser(email);
          usersList.appendChild(div);
        }
      });
    });

    function selectUser(email) {
      selectedUser = email;
      document.getElementById("chatHeader").innerText =
        "Chat with " + email;
      document.getElementById("messages").innerHTML = "";
    }

    // SEND MESSAGE
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (!message || !selectedUser) return;

      socket.emit("send_message", {
        senderEmail: currentUser.email,
        receiverEmail: selectedUser,
        message: message,
      });

      appendMessage(message, "right");
      input.value = "";
    }

    // RECEIVE MESSAGE
    socket.on("receive_message", (data) => {
      appendMessage(data.message, "left");
    });

    function appendMessage(text, side) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${side}`;
      msgDiv.innerText = text;

      const messages = document.getElementById("messages");
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>

</body>
</html>
