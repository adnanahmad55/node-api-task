<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/socket.io/socket.io.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: #f0f2f5;
    }

    /* ========== LEFT USERS ========== */
    .sidebar {
      width: 25%;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .chat-user {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-user:hover { background: #f5f5f5; }

    .status-dot {
      height: 8px;
      width: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .online { background: green; }
    .offline { background: red; }

    .badge {
      background: red;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
    }

    /* ========== CHAT CENTER ========== */
    .chat {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #667eea;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages {
      flex: 1;
      padding: 15px;
      background: #e5ddd5;
      overflow-y: auto;
      display: flex;
      flex-direction: column; /* Better message alignment */
    }

    .msg {
      max-width: 60%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      word-wrap: break-word;
      position: relative;
    }

    .left { background: #fff; align-self: flex-start; }
    .right { background: #dcf8c6; align-self: flex-end; }

    .chat-input {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input i {
      font-size: 20px;
      margin: 0 8px;
      cursor: pointer;
      color: #666;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }

    .send-btn {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      padding: 10px 14px;
      cursor: pointer;
      margin-left: 5px;
    }

    /* ========== RIGHT MEDIA ========== */
    .media-panel {
      width: 25%;
      background: #fff;
      border-left: 1px solid #ddd;
      padding: 15px;
    }

    .media-panel h4 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <div class="sidebar-header">
    Chats
    <span style="float:right;cursor:pointer" onclick="logout()">Logout</span>
  </div>
  <div id="usersList"></div>
</div>

<div class="chat">
  <div class="chat-header">
    <span id="chatHeader">Select a chat</span>
    <span>
      <i class="bi bi-telephone"></i>
      <i class="bi bi-camera-video"></i>
      <i class="bi bi-three-dots-vertical"></i>
    </span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="chat-input">
    <i class="bi bi-emoji-smile"></i>
    <i class="bi bi-paperclip"></i>
    <input id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)" />
    <i class="bi bi-mic"></i>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="media-panel">
  <h4>Media</h4>
  <p>(Images / Videos will appear here)</p>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", {
    transports: ["websocket"]
  });

  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser) location.href = "index.html";

  socket.emit("join", { email: loggedUser.email });

  let activeUser = null;
  let unread = {};

  // Load chat users
  function loadUsers() {
    fetch(`/api/chat/users/${loggedUser.email}`)
      .then(res => res.json())
      .then(users => {
        const list = document.getElementById("usersList");
        list.innerHTML = ""; // Clear list before loading
        users.forEach(user => {
          // Check if backend returns objects or just strings
          const email = user.email || user; 
          const name = user.firstName || email; 

          unread[email] = unread[email] || 0;
          const div = document.createElement("div");
          div.className = "chat-user";
          div.innerHTML = `
            <span>
              <span class="status-dot offline" id="dot-${email}"></span>
              ${name}
            </span>
            <span class="badge" id="badge-${email}" style="display:${unread[email] > 0 ? 'inline-block' : 'none'}">${unread[email]}</span>
          `;
          div.onclick = () => openChat(email, name);
          list.appendChild(div);
        });
      });
  }

  loadUsers();

  socket.on("live_users_list", users => {
    // Reset all dots to offline first
    document.querySelectorAll('.status-dot').forEach(dot => {
        dot.classList.remove("online");
        dot.classList.add("offline");
    });
    // Set active ones to online
    users.forEach(email => {
      const dot = document.getElementById(`dot-${email}`);
      if (dot) {
        dot.classList.remove("offline");
        dot.classList.add("online");
      }
    });
  });

  // Listen for sidebar updates (new users)
  socket.on("sidebar_update", () => {
    loadUsers();
  });

  function openChat(email, name) {
    activeUser = email;
    unread[email] = 0;
    const badge = document.getElementById(`badge-${email}`);
    if(badge) badge.style.display = "none";
    
    document.getElementById("chatHeader").innerText = "Chat with " + name;
    document.getElementById("messages").innerHTML = "";

    socket.emit("mark_read", { userEmail: loggedUser.email, otherEmail: email });

    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(msgs => {
        msgs.forEach(m => {
          appendMessage(m.message, m.senderEmail === loggedUser.email ? "right" : "left");
        });
        scrollToBottom();
      });
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg || !activeUser) return;

    socket.emit("send_message", {
      senderEmail: loggedUser.email,
      receiverEmail: activeUser,
      message: msg
    });

    appendMessage(msg, "right");
    input.value = "";
    scrollToBottom();
  }

  socket.on("receive_message", data => {
    if (data.senderEmail === activeUser) {
      appendMessage(data.message, "left");
      scrollToBottom();
    } else {
      unread[data.senderEmail] = (unread[data.senderEmail] || 0) + 1;
      const badge = document.getElementById(`badge-${data.senderEmail}`);
      if (badge) {
        badge.innerText = unread[data.senderEmail];
        badge.style.display = "inline-block";
      }
    }
  });

  function appendMessage(text, side) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
  }

  function scrollToBottom() {
    const msgDiv = document.getElementById("messages");
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  function logout() {
    localStorage.clear();
    location.href = "index.html";
  }
</script>

</body>
</html>
