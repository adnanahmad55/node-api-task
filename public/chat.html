<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Messenger | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/socket.io/socket.io.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; height: 100vh; display: flex; background: #f0f2f5; color: #1c1e21; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 320px;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 20px 15px;
      background: #0084ff;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-search { padding: 10px; background: #f0f2f5; }
    .user-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
    }

    .section-label {
      padding: 10px 15px;
      background: #f8f9fa;
      font-size: 11px;
      color: #8a8d91;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #f0f2f5;
    }

    .users-list-container { flex: 1; overflow-y: auto; }

    .chat-user {
      padding: 12px 15px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: 0.2s;
    }
    .chat-user:hover { background: #f5f6f7; }
    
    .avatar-container { position: relative; margin-right: 12px; }
    .avatar {
      width: 45px;
      height: 45px;
      background: #e4e6eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #050505;
    }

    .status-dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 2px;
      border: 2px solid white;
    }
    .online { background-color: #31a24c; } 
    .offline { background-color: #bec3c9; }

    .user-info { flex: 1; }
    .user-info .name { font-weight: 600; font-size: 0.95rem; }
    
    .badge {
      background: #fa3e3e;
      color: white;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
    }

    /* ========== CHAT AREA ========== */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      background: #fff;
    }

    .messages {
      flex: 1;
      padding: 20px;
      background: #f0f2f5;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .msg {
      max-width: 65%;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .left { background: #e4e6eb; align-self: flex-start; color: #050505; }
    .right { background: #0084ff; align-self: flex-end; color: white; }

    /* Media Styling inside Chat */
    .chat-media {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
      display: block;
      cursor: pointer;
    }

    .input-box {
      padding: 15px;
      display: flex;
      align-items: center;
      border-top: 1px solid #ddd;
    }

    .input-box input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
      background: #f0f2f5;
    }

    .send-btn, .attach-btn {
      background: none;
      border: none;
      color: #0084ff;
      font-size: 1.4rem;
      cursor: pointer;
      margin-left: 10px;
      display: flex;
      align-items: center;
    }

    .attach-btn { margin-left: 0; margin-right: 10px; color: #8a8d91; }
    .attach-btn:hover { color: #0084ff; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8a8d91;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <div class="sidebar-header">
    <span>Messages</span>
    <i class="bi bi-box-arrow-right" style="cursor:pointer" onclick="logout()"></i>
  </div>
  
  <div class="user-search">
    <input type="text" placeholder="Search Messenger">
  </div>

  <div class="users-list-container">
    <div class="section-label" id="onlineLabel">Online Contacts</div>
    <div id="onlineUsersList"></div>
    
    <div class="section-label">All Conversations</div>
    <div id="allUsersList"></div>
  </div>
</div>

<div class="chat-area">
  <div id="activeChatUI" style="display: none; flex-direction: column; height: 100%;">
    <div class="chat-header">
      <div class="avatar" id="headerAvatar" style="width: 35px; height: 35px; margin-right: 10px; font-size: 0.9rem;"></div>
      <span id="chatTitle" style="font-weight: bold;"></span>
    </div>
    <div class="messages" id="messages"></div>
    
    <div class="input-box">
      <input type="file" id="mediaInput" style="display:none" accept="image/*,video/*" onchange="handleMediaUpload(this)">
      
      <button class="attach-btn" onclick="document.getElementById('mediaInput').click()">
        <i class="bi bi-paperclip"></i>
      </button>

      <input id="messageInput" type="text" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage()" />
      
      <button class="send-btn" onclick="sendMessage()">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>

  <div id="emptyState" class="empty-state">
    <i class="bi bi-chat-dots" style="font-size: 4rem; margin-bottom: 10px;"></i>
    <p>Select a contact to start chatting</p>
  </div>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", { transports: ["websocket"] });
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  
  if (!loggedUser) location.href = "index.html";

  socket.emit("join", { email: loggedUser.email });

  let activeUser = null;
  let unreadCount = {};
  let currentOnlineEmails = [];
  let cachedUsers = [];

  function fetchSidebarData() {
    fetch(`/api/chat/users/${loggedUser.email}`)
      .then(res => res.json())
      .then(users => {
        cachedUsers = users;
        renderSidebar();
      });
  }

  function renderSidebar() {
    const onlineList = document.getElementById("onlineUsersList");
    const allList = document.getElementById("allUsersList");
    onlineList.innerHTML = "";
    allList.innerHTML = "";

    cachedUsers.forEach(user => {
      const email = user.email.toLowerCase();
      if (email === loggedUser.email.toLowerCase()) return;
      const name = user.firstName || email;
      const initial = name.charAt(0).toUpperCase();
      const isOnline = currentOnlineEmails.includes(email);

      const userHtml = `
        <div class="chat-user" onclick="openChat('${email}', '${name}')">
          <div class="avatar-container">
            <div class="avatar">${initial}</div>
            <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
          </div>
          <div class="user-info">
            <div class="name">${name}</div>
          </div>
          <div id="badge-${email}" class="badge" style="display:${unreadCount[email] > 0 ? 'inline-block' : 'none'}">
            ${unreadCount[email] || 0}
          </div>
        </div>
      `;
      if (isOnline) onlineList.insertAdjacentHTML('beforeend', userHtml);
      else allList.insertAdjacentHTML('beforeend', userHtml);
    });
    document.getElementById("onlineLabel").style.display = onlineList.innerHTML === "" ? "none" : "block";
  }

  socket.on("live_users_list", onlineEmails => {
    currentOnlineEmails = onlineEmails.map(e => e.toLowerCase());
    renderSidebar();
  });

  socket.on("sidebar_update", () => fetchSidebarData());

  function openChat(email, name) {
    activeUser = email;
    document.getElementById("emptyState").style.display = "none";
    document.getElementById("activeChatUI").style.display = "flex";
    document.getElementById("chatTitle").innerText = name;
    document.getElementById("headerAvatar").innerText = name.charAt(0).toUpperCase();
    document.getElementById("messages").innerHTML = "";
    
    unreadCount[email] = 0;
    renderSidebar();

    socket.emit("mark_read", { userEmail: loggedUser.email, otherEmail: email });

    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(msgs => {
        msgs.forEach(m => {
          // Pass media details to appendMessage
          appendMessage(m.message, 
            m.senderEmail.toLowerCase() === loggedUser.email.toLowerCase() ? "right" : "left",
            m.fileUrl, 
            m.messageType);
        });
        scrollToBottom();
      });
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg || !activeUser) return;

    socket.emit("send_message", { 
      senderEmail: loggedUser.email, 
      receiverEmail: activeUser, 
      message: msg,
      messageType: 'text' 
    });
    appendMessage(msg, "right");
    input.value = "";
    scrollToBottom();
  }

  // --- NEW: Handle Media Selection ---
  async function handleMediaUpload(input) {
    if (!input.files[0] || !activeUser) return;
    
    const file = input.files[0];
    const formData = new FormData();
    formData.append("file", file);

    // Placeholder message showing "Uploading..."
    const tempId = Date.now();
    appendMessage("Uploading media...", "right", null, "text", tempId);

    try {
      const res = await fetch("/api/chat/upload", { method: "POST", body: formData });
      const data = await res.json();

      if (data.url) {
        // Remove "Uploading..." message
        const tempMsg = document.getElementById(`msg-${tempId}`);
        if(tempMsg) tempMsg.remove();

        // Send via socket
        socket.emit("send_message", {
          senderEmail: loggedUser.email,
          receiverEmail: activeUser,
          message: "", 
          fileUrl: data.url,
          messageType: data.type
        });

        appendMessage("", "right", data.url, data.type);
        scrollToBottom();
      }
    } catch (err) {
      alert("Upload failed!");
      console.error(err);
    }
  }

  socket.on("receive_message", data => {
    const sender = data.senderEmail.toLowerCase();
    if (sender === activeUser?.toLowerCase()) {
      appendMessage(data.message, "left", data.fileUrl, data.messageType);
      scrollToBottom();
    } else {
      unreadCount[sender] = (unreadCount[sender] || 0) + 1;
      renderSidebar();
    }
  });

  // --- UPDATED: appendMessage to handle media ---
  function appendMessage(text, side, fileUrl = null, type = 'text', tempId = null) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    if(tempId) div.id = `msg-${tempId}`;

    if (type === 'image' && fileUrl) {
      div.innerHTML = `<img src="${fileUrl}" class="chat-media" onclick="window.open('${fileUrl}')">`;
      if(text) div.innerHTML += `<div>${text}</div>`;
    } 
    else if (type === 'video' && fileUrl) {
      div.innerHTML = `<video src="${fileUrl}" controls class="chat-media"></video>`;
      if(text) div.innerHTML += `<div>${text}</div>`;
    } 
    else {
      div.innerText = text;
    }
    
    document.getElementById("messages").appendChild(div);
  }

  function scrollToBottom() {
    const m = document.getElementById("messages");
    m.scrollTop = m.scrollHeight;
  }

  function logout() {
    localStorage.clear();
    location.href = "index.html";
  }

  fetchSidebarData();
</script>

</body>
</html>
