<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; height: 100vh; display: flex; background: #f0f2f5; }

    /* ========== SIDEBAR ========== */
    .sidebar { width: 25%; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #667eea; color: white; font-weight: bold; display: flex; justify-content: space-between; }
    
    .section-title { padding: 10px 15px; background: #f8f9fa; font-size: 12px; color: #666; font-weight: bold; border-bottom: 1px solid #eee; }
    .user-container { flex: 1; overflow-y: auto; }

    .chat-user { padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
    .chat-user:hover { background: #f1f3ff; }

    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; }
    .online { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
    .offline { background: #95a5a6; }

    .badge { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: bold; }

    /* ========== CHAT PANEL ========== */
    .chat { width: 50%; display: flex; flex-direction: column; }
    .chat-header { padding: 15px; background: #667eea; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .messages { flex: 1; padding: 15px; background: #e5ddd5; overflow-y: auto; display: flex; flex-direction: column; }

    .msg { max-width: 70%; padding: 8px 12px; margin-bottom: 8px; border-radius: 12px; font-size: 14px; position: relative; word-wrap: break-word; }
    .left { background: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
    .right { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 2px; }

    .chat-input { display: flex; align-items: center; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    .chat-input input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; margin: 0 10px; }
    .send-btn { background: #667eea; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

    /* ========== MEDIA PANEL ========== */
    .media-panel { width: 25%; background: #fff; border-left: 1px solid #ddd; padding: 15px; text-align: center; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <span><i class="bi bi-chat-dots-fill"></i> Messenger</span>
    <span style="cursor:pointer" onclick="logout()"><i class="bi bi-box-arrow-right"></i></span>
  </div>

  <div class="user-container">
    <div class="section-title">ONLINE USERS</div>
    <div id="onlineList"></div>
    
    <div class="section-title">ALL CONVERSATIONS</div>
    <div id="allUsersList"></div>
  </div>
</div>

<div class="chat">
  <div class="chat-header">
    <span id="chatHeader">Select a friend to start chatting</span>
    <div id="headerIcons" style="display:none">
      <i class="bi bi-telephone ms-3"></i>
      <i class="bi bi-camera-video ms-3"></i>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-input">
    <i class="bi bi-emoji-smile"></i>
    <input id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
  </div>
</div>

<div class="media-panel">
  <h4>Chat Info</h4>
  <p id="infoText">Select a user to see media</p>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", { transports: ["websocket"] });
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser) location.href = "index.html";

  let activeUser = null;
  let unread = {};
  let allChattedUsers = [];

  socket.emit("join", { email: loggedUser.email });

  // 1. Initial Load: Get all users I have chatted with
  function loadSidebar() {
    fetch(`/api/chat/users/${loggedUser.email}`)
      .then(res => res.json())
      .then(users => {
        allChattedUsers = users;
        renderUsers();
      });
  }

  // 2. Render Lists (Online vs All)
  function renderUsers(onlineEmails = []) {
    const onlineDiv = document.getElementById("onlineList");
    const allDiv = document.getElementById("allUsersList");
    
    onlineDiv.innerHTML = "";
    allDiv.innerHTML = "";

    // Sort users: Online ones first
    allChattedUsers.forEach(email => {
      if (email === loggedUser.email) return;
      
      const isOnline = onlineEmails.includes(email);
      const userEl = document.createElement("div");
      userEl.className = "chat-user";
      userEl.innerHTML = `
        <span>
          <span class="status-dot ${isOnline ? 'online' : 'offline'}" id="dot-${email}"></span>
          ${email}
        </span>
        <span class="badge" id="badge-${email}" style="display:${unread[email] > 0 ? 'inline-block' : 'none'}">${unread[email] || 0}</span>
      `;
      userEl.onclick = () => openChat(email);

      if (isOnline) {
        onlineDiv.appendChild(userEl);
      } else {
        allDiv.appendChild(userEl);
      }
    });
  }

  socket.on("live_users_list", users => {
    renderUsers(users);
  });

  function openChat(email) {
    activeUser = email;
    unread[email] = 0;
    document.getElementById(`badge-${email}`).style.display = "none";
    document.getElementById("chatHeader").innerText = email;
    document.getElementById("headerIcons").style.display = "block";
    document.getElementById("messages").innerHTML = "";

    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(msgs => {
        msgs.forEach(m => appendMessage(m.message, m.senderEmail === loggedUser.email ? "right" : "left"));
        scrollToBottom();
      });
    
    socket.emit("mark_read", { userEmail: loggedUser.email, otherEmail: email });
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg || !activeUser) return;

    socket.emit("send_message", {
      senderEmail: loggedUser.email,
      receiverEmail: activeUser,
      message: msg
    });

    appendMessage(msg, "right");
    input.value = "";
    scrollToBottom();
  }

  socket.on("receive_message", data => {
    if (data.senderEmail === activeUser) {
      appendMessage(data.message, "left");
      scrollToBottom();
    } else {
      unread[data.senderEmail] = (unread[data.senderEmail] || 0) + 1;
      loadSidebar(); // Refresh list to show badge
    }
  });

  function appendMessage(text, side) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
  }

  function scrollToBottom() {
    const msgDiv = document.getElementById("messages");
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  function logout() {
    localStorage.clear();
    location.href = "index.html";
  }

  loadSidebar();
</script>
</body>
</html>
