<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: #f0f2f5;
    }

    .chat {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #667eea;
      color: white;
      font-size: 16px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      clear: both;
    }

    .left {
      background: #fff;
      float: left;
    }

    .right {
      background: #dcf8c6;
      float: right;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="chat">
  <div class="chat-header" id="chatHeader">Chat</div>
  <div class="messages" id="messages"></div>

  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com");

  // ✅ GET LOGGED USER
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser || !loggedUser.email) {
    alert("Please login again");
    window.location.href = "index.html";
  }

  // ✅ GET RECEIVER FROM URL
  const params = new URLSearchParams(window.location.search);
  const receiverEmail = params.get("email");

  if (!receiverEmail) {
    alert("No chat user selected");
    window.location.href = "list.html";
  }

  // HEADER
  document.getElementById("chatHeader").innerText =
    "Chat with " + receiverEmail;

  // 🔥 JOIN SOCKET
  socket.emit("join", { email: loggedUser.email });

  // SEND MESSAGE
  function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if (!message) return;

    socket.emit("send_message", {
      senderEmail: loggedUser.email,
      receiverEmail: receiverEmail,
      message: message
    });

    appendMessage(message, "right");
    input.value = "";
  }

  // RECEIVE MESSAGE
  socket.on("receive_message", (data) => {
    if (data.senderEmail === receiverEmail) {
      appendMessage(data.message, "left");
    }
  });

  function appendMessage(text, side) {
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${side}`;
    msgDiv.innerText = text;

    const messages = document.getElementById("messages");
    messages.appendChild(msgDiv);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
