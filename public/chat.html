<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: #f0f2f5;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 25%;
      background: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 15px;
      background: #667eea;
      color: white;
      font-weight: bold;
    }

    .chat-user {
      padding: 12px 15px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .chat-user:hover {
      background: #f5f5f5;
    }

    .online-dot {
      height: 8px;
      width: 8px;
      background: green;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    /* ===== CHAT AREA ===== */
    .chat {
      width: 75%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #667eea;
      color: white;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .msg {
      max-width: 60%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 14px;
      clear: both;
    }

    .left {
      background: #fff;
      float: left;
    }

    .right {
      background: #dcf8c6;
      float: right;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 18px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
  <div class="sidebar-header">Chats</div>
  <div id="chatUsers"></div>
</div>

<!-- ===== CHAT ===== -->
<div class="chat">
  <div class="chat-header" id="chatHeader">Select a chat</div>
  <div class="messages" id="messages"></div>

  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com");

  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser) location.href = "index.html";

  let activeUser = null;

  socket.emit("join", { email: loggedUser.email });

  // ======================
  // LOAD LEFT SIDEBAR USERS
  // ======================
  fetch(`/api/chat/users/${loggedUser.email}`)
    .then(res => res.json())
    .then(users => {
      const container = document.getElementById("chatUsers");
      container.innerHTML = "";

      users.forEach(email => {
        const div = document.createElement("div");
        div.className = "chat-user";
        div.innerText = email;
        div.onclick = () => openChat(email);
        container.appendChild(div);
      });
    });

  // ======================
  // OPEN CHAT + LOAD HISTORY
  // ======================
  function openChat(email) {
    activeUser = email;
    document.getElementById("chatHeader").innerText =
      "Chat with " + email;

    document.getElementById("messages").innerHTML = "";

    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(messages => {
        messages.forEach(m => {
          appendMessage(
            m.message,
            m.senderEmail === loggedUser.email ? "right" : "left"
          );
        });
      });
  }

  // ======================
  // SEND MESSAGE
  // ======================
  function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message || !activeUser) return;

    socket.emit("send_message", {
      senderEmail: loggedUser.email,
      receiverEmail: activeUser,
      message
    });

    appendMessage(message, "right");
    input.value = "";
  }

  // ======================
  // RECEIVE MESSAGE
  // ======================
  socket.on("receive_message", data => {
    if (data.senderEmail === activeUser) {
      appendMessage(data.message, "left");
    }
  });

  function appendMessage(text, side) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    div.innerText = text;

    const messages = document.getElementById("messages");
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
