<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: "Segoe UI", sans-serif;
      background: #f0f2f5;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 25%;
      background: #fff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    .sidebar h3 {
      margin: 0;
      padding: 15px;
      background: #667eea;
      color: white;
    }

    .chat-user {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      position: relative;
    }

    .chat-user:hover {
      background: #f5f5f5;
    }

    .unread {
      position: absolute;
      right: 12px;
      top: 14px;
      background: red;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
    }

    /* ===== CHAT ===== */
    .chat {
      width: 75%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      background: #667eea;
      color: white;
      font-size: 16px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .msg {
      max-width: 60%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      clear: both;
      font-size: 14px;
    }

    .left {
      background: #fff;
      float: left;
      border-top-left-radius: 0;
    }

    .right {
      background: #dcf8c6;
      float: right;
      border-top-right-radius: 0;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 18px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ===== LEFT SIDEBAR ===== -->
<div class="sidebar">
  <h3>Chats</h3>
  <div id="chatUsers"></div>
</div>

<!-- ===== CHAT AREA ===== -->
<div class="chat">
  <div class="chat-header" id="chatHeader">Select a chat</div>
  <div class="messages" id="messages"></div>

  <div class="chat-input">
    <input id="messageInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", {
    transports: ["websocket"],
    reconnection: true
  });

  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser) location.href = "index.html";

  socket.emit("join", { email: loggedUser.email });

  let activeUser = null;
  let unread = {};

  /* ==========================
     LOAD CHAT USERS (SIDEBAR)
  ========================== */
  function refreshSidebar() {
    fetch(`/api/chat/users/${loggedUser.email}`)
      .then(res => res.json())
      .then(users => {
        const box = document.getElementById("chatUsers");
        box.innerHTML = "";

        users.forEach(email => {
          const div = document.createElement("div");
          div.className = "chat-user";

          div.innerHTML = `
            ${email}
            ${unread[email] ? `<span class="unread">${unread[email]}</span>` : ""}
          `;

          div.onclick = () => openChat(email);
          box.appendChild(div);
        });
      });
  }

  refreshSidebar();

  /* ==========================
     OPEN CHAT
  ========================== */
  function openChat(email) {
    activeUser = email;
    unread[email] = 0;
    localStorage.setItem("activeChat", email);

    document.getElementById("chatHeader").innerText =
      "Chat with " + email;

    document.getElementById("messages").innerHTML = "";

    fetch(`/api/chat/messages/${loggedUser.email}/${email}`)
      .then(res => res.json())
      .then(msgs => {
        msgs.forEach(m => {
          appendMessage(
            m.message,
            m.senderEmail === loggedUser.email ? "right" : "left"
          );
        });
      });

    refreshSidebar();
  }

  /* ==========================
     SEND MESSAGE
  ========================== */
  function sendMessage() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg || !activeUser) return;

    socket.emit("send_message", {
      senderEmail: loggedUser.email,
      receiverEmail: activeUser,
      message: msg
    });

    appendMessage(msg, "right");
    input.value = "";
  }

  /* ==========================
     RECEIVE MESSAGE
  ========================== */
  socket.on("receive_message", data => {
    if (data.senderEmail === activeUser) {
      appendMessage(data.message, "left");
    } else {
      unread[data.senderEmail] =
        (unread[data.senderEmail] || 0) + 1;
      refreshSidebar();
    }
  });

  /* ==========================
     APPEND MESSAGE
  ========================== */
  function appendMessage(text, side) {
    const div = document.createElement("div");
    div.className = `msg ${side}`;
    div.innerText = text;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  /* ==========================
     RESTORE LAST CHAT
  ========================== */
  const lastChat = localStorage.getItem("activeChat");
  if (lastChat) openChat(lastChat);
</script>

</body>
</html>
