<!DOCTYPE html>
<html>
<head>
  <title>Add New User</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">

  <div class="nav">
    <span></span>
    <a href="list.html">Show All Users</a>
  </div>

  <h2>Add New User</h2>

  <form id="userForm">
    <input type="text" placeholder="First Name" id="firstName" required>
    <input type="text" placeholder="Last Name" id="lastName" required>
    <input type="text" placeholder="Mobile (10 digits)" id="mobile" required>
    <input type="email" placeholder="Email" id="email" required>

    <input type="text" placeholder="Street" id="street">
    <input type="text" placeholder="City" id="city">
    <input type="text" placeholder="State" id="state">
    <input type="text" placeholder="Country" id="country">

    <input type="text" placeholder="Login (8 chars)" id="login" required>
    <input type="password" placeholder="Password (Aa@123)" id="password" required>

    <button type="submit">Save User</button>
  </form>

  <p id="msg"></p>
</div>

<script>
$("#userForm").submit(function(e){
  e.preventDefault();

  $("#msg").text("");

  const data = {
    firstName: $("#firstName").val().trim(),
    lastName: $("#lastName").val().trim(),
    mobile: $("#mobile").val().trim(),
    email: $("#email").val().trim(),
    address: {
      street: $("#street").val().trim(),
      city: $("#city").val().trim(),
      state: $("#state").val().trim(),
      country: $("#country").val().trim()
    },
    login: $("#login").val().trim(),
    password: $("#password").val()
  };

  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/add",   // ✅ RENDER URL
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify(data),

    success: function (res) {
      $("#msg")
        .css("color", "green")
        .text("User added successfully ✅");

      $("#userForm")[0].reset();
    },

    error: function (err) {
      console.error(err);

      let message =
        err.responseJSON?.error ||
        err.responseJSON?.message ||
        err.responseText ||
        "Something went wrong";

      $("#msg")
        .css("color", "red")
        .text(message);
    }
  });
});
</script>

</body>
</html>
