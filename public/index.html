<!DOCTYPE html>
<html>
<head>
  <title>User Register & Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">

  <div class="nav">
    <span></span>
    <a href="list.html">Show All Users</a>
  </div>

  <!-- =========================
       REGISTER SECTION
  ========================== -->
  <h2>Add New User (Register)</h2>

  <form id="userForm">
    <input type="text" placeholder="First Name" id="firstName" required>
    <input type="text" placeholder="Last Name" id="lastName" required>
    <input type="text" placeholder="Mobile (10 digits)" id="mobile" required>
    <input type="email" placeholder="Email" id="email" required>

    <input type="text" placeholder="Street" id="street">
    <input type="text" placeholder="City" id="city">
    <input type="text" placeholder="State" id="state">
    <input type="text" placeholder="Country" id="country">

    <input type="text" placeholder="Login (8 letters only)" id="login" required>
    <small id="loginHint" class="hint"></small>

    <input type="password" placeholder="Password" id="password" required>
    <small id="passwordHint" class="hint"></small>

    <button type="submit">Save User</button>
  </form>

  <p id="msg"></p>

  <hr>

  <!-- =========================
       LOGIN SECTION
  ========================== -->
  <h2>Login</h2>

  <form id="loginForm">
    <input type="email" placeholder="Email" id="loginEmail" required>
    <input type="password" placeholder="Password" id="loginPassword" required>
    <button type="submit">Login</button>
  </form>

  <p id="loginMsg"></p>

</div>

<!-- SOCKET.IO -->
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io("https://node-api-task-nl8e.onrender.com");

  socket.on("live_users_list", (users) => {
    console.log("🟢 Live Users:", users);
  });
</script>

<script>
/* ======================
   LIVE LOGIN VALIDATION
====================== */
$("#login").on("input", function () {
  const login = $(this).val();
  const loginRegex = /^[A-Za-z0-9]{8}$/;

  if (loginRegex.test(login)) {
    $("#loginHint").text("✔ Valid login").addClass("success").removeClass("error");
  } else {
    $("#loginHint").text("Login must be exactly 8 characters").addClass("error").removeClass("success");
  }
});

/* ======================
   LIVE PASSWORD VALIDATION
====================== */
$("#password").on("input", function () {
  const password = $(this).val();
  const passwordRegex =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}$/;

  if (passwordRegex.test(password)) {
    $("#passwordHint").text("✔ Strong password").addClass("success").removeClass("error");
  } else {
    $("#passwordHint").text("Weak password").addClass("error").removeClass("success");
  }
});

/* ======================
   REGISTER FORM SUBMIT
====================== */
$("#userForm").submit(function (e) {
  e.preventDefault();

  const data = {
    firstName: $("#firstName").val().trim(),
    lastName: $("#lastName").val().trim(),
    mobile: $("#mobile").val().trim(),
    email: $("#email").val().trim(),
    address: {
      street: $("#street").val().trim(),
      city: $("#city").val().trim(),
      state: $("#state").val().trim(),
      country: $("#country").val().trim()
    },
    login: $("#login").val().trim(),
    password: $("#password").val()
  };

  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/add",
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify(data),

    success: function () {
      $("#msg").css("color", "green").text("User registered successfully ✅");
      $("#userForm")[0].reset();
    },

    error: function (err) {
      $("#msg").css("color", "red").text(
        err.responseJSON?.message || err.responseText
      );
    }
  });
});

/* ======================
   LOGIN FORM SUBMIT
====================== */
$("#loginForm").submit(function (e) {
  e.preventDefault();

  const email = $("#loginEmail").val().trim();
  const password = $("#loginPassword").val();

  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/login",
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify({ email, password }),

    success: function (res) {
      $("#loginMsg").css("color", "green").text("Login successful ✅");

      // 🔥 SOCKET JOIN AFTER LOGIN (CORRECT)
      socket.emit("join_live_users", {
        email: res.user.email,
        firstName: res.user.firstName,
        lastName: res.user.lastName
      });
    },

    error: function (err) {
      $("#loginMsg").css("color", "red").text(
        err.responseJSON?.message || "Login failed"
      );
    }
  });
});
</script>

</body>
</html>
