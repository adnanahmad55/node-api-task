<!DOCTYPE html>
<html>
<head>
  <title>Add New User</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container">

  <div class="nav">
    <span></span>
    <a href="list.html">Show All Users</a>
  </div>

  <h2>Add New User</h2>

  <form id="userForm">
    <input type="text" placeholder="First Name" id="firstName" required>
    <input type="text" placeholder="Last Name" id="lastName" required>
    <input type="text" placeholder="Mobile (10 digits)" id="mobile" required>
    <input type="email" placeholder="Email" id="email" required>

    <input type="text" placeholder="Street" id="street">
    <input type="text" placeholder="City" id="city">
    <input type="text" placeholder="State" id="state">
    <input type="text" placeholder="Country" id="country">

    <input type="text" placeholder="Login (8 letters only)" id="login" required>
    <small id="loginHint" class="hint"></small>

    <input type="password" placeholder="Password" id="password" required>
    <small id="passwordHint" class="hint"></small>

    <button type="submit">Save User</button>
  </form>

  <p id="msg"></p>
</div>

<!-- 🔥 SOCKET.IO CLIENT (MUST BE BEFORE MAIN SCRIPT) -->
<script src="/socket.io/socket.io.js"></script>
<script>
  // Render backend URL
  const socket = io("https://node-api-task-nl8e.onrender.com");
</script>

<script>
/* ======================
   LIVE USERNAME VALIDATION
====================== */
$("#login").on("input", function () {
  const login = $(this).val();
  const loginRegex = /^[A-Za-z]{8}$/;

  if (loginRegex.test(login)) {
    $("#loginHint")
      .text("✔ Valid username")
      .removeClass("error")
      .addClass("success");
  } else {
    $("#loginHint")
      .text("Username must be exactly 8 letters (A–Z only)")
      .removeClass("success")
      .addClass("error");
  }
});

/* ======================
   LIVE PASSWORD VALIDATION
====================== */
$("#password").on("input", function () {
  const password = $(this).val();
  const passwordRegex =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&]).{8,}$/;

  if (passwordRegex.test(password)) {
    $("#passwordHint")
      .text("✔ Strong password")
      .removeClass("error")
      .addClass("success");
  } else {
    $("#passwordHint")
      .html(
        "Password must contain:<br>• 1 uppercase<br>• 1 lowercase<br>• 1 number<br>• 1 special character<br>• Min 8 characters"
      )
      .removeClass("success")
      .addClass("error");
  }
});

/* ======================
   FORM SUBMIT
====================== */
$("#userForm").submit(function (e) {
  e.preventDefault();

  $("#msg").text("");

  const data = {
    firstName: $("#firstName").val().trim(),
    lastName: $("#lastName").val().trim(),
    mobile: $("#mobile").val().trim(),
    email: $("#email").val().trim(),
    address: {
      street: $("#street").val().trim(),
      city: $("#city").val().trim(),
      state: $("#state").val().trim(),
      country: $("#country").val().trim()
    },
    login: $("#login").val().trim(),
    password: $("#password").val()
  };

  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/add",
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify(data),

    success: function () {

      // 🔥 SOCKET ROOM JOIN AFTER DB INSERT
      socket.emit("join_live_users", {
        email: data.email,
        firstName: data.firstName,
        lastName: data.lastName
      });

      $("#msg").css("color", "green").text("User added successfully ✅");
      $("#userForm")[0].reset();
      $("#loginHint").text("");
      $("#passwordHint").text("");
    },

    error: function (err) {
      let message =
        err.responseJSON?.error ||
        err.responseJSON?.message ||
        err.responseText ||
        "Something went wrong";

      $("#msg").css("color", "red").text(message);
    }
  });
});
</script>

</body>
</html>
