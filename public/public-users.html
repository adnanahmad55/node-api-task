<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 | Registered Users Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; font-family: 'Segoe UI', sans-serif; }
    .directory-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    .user-table-card { border: 1px solid #eee; border-radius: 12px; overflow: hidden; margin-top: 20px; }
    .table thead { background-color: #0084ff; color: white; }
    .avatar-circle { width: 35px; height: 35px; background: #764ba2; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="directory-container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="text-dark m-0 fw-bold">Registered User Directory</h2>
        <a href="index.html" class="btn btn-primary shadow-sm">Go to Login</a>
    </div>
    
    <div class="user-table-card">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Joined Date</th>
                </tr>
            </thead>
            <tbody id="publicUserList">
                <tr>
                    <td colspan="4" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Loading registered users...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
  </div>

  <script>
    async function loadPublicUsers() {
        const listBody = document.getElementById('publicUserList');
        try {
            // 🔥 URL verify karein: Aapke backend route se matching
            const res = await fetch('/api/chat/all-registered');
            const users = await res.json();
            
            console.log("JSON Data:", users); // Browser Console (F12) mein check karein

            if (!Array.isArray(users)) {
                listBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Invalid API Response</td></tr>`;
                return;
            }

            listBody.innerHTML = "";
            if (users.length === 0) {
                listBody.innerHTML = `<tr><td colspan="4" class="text-center py-4">No users registered yet.</td></tr>`;
                return;
            }

            // Database data ko table mein map karein
            users.forEach((user, index) => {
                const fullName = `${user.firstName || ''} ${user.lastName || ''}`;
                const regDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A';
                const initial = user.firstName ? user.firstName[0].toUpperCase() : '?';

                listBody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle me-2">${initial}</div>
                                <span>${fullName}</span>
                            </div>
                        </td>
                        <td><span class="text-muted">${user.email}</span></td>
                        <td><span class="badge bg-light text-dark border">${regDate}</span></td>
                    </tr>`;
            });
        } catch (err) {
            console.error("Fetch Error:", err);
            listBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: Failed to connect to server.</td></tr>`;
        }
    }
    // Page load par function call
    loadPublicUsers();
  </script>
</body>
</html>
