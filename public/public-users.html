<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 | Registered Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; padding: 40px 20px; }
    .directory-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .user-card { border: 1px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 12px; }
    .avatar-circle { width: 45px; height: 45px; background: #0084ff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
  </style>
</head>
<body>
  <div class="directory-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary m-0">Registered Users (Task 2)</h2>
        <a href="index.html" class="btn btn-primary btn-sm">Go to Login</a>
    </div>
    
    <div id="publicUserList">
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Connecting to Database...</p>
        </div>
    </div>
  </div>

  <script>
    async function loadPublicUsers() {
        const listDiv = document.getElementById('publicUserList');
        try {
            // 🔥 FIXED: matching backend route exactly
            const res = await fetch('/api/chat/all-registered');
            const users = await res.json();
            
            console.log("Data received:", users); // Console mein check karne ke liye

            if (!Array.isArray(users)) {
                listDiv.innerHTML = `<div class="alert alert-warning">API Response is not an array. Check Backend.</div>`;
                return;
            }

            listDiv.innerHTML = "";
            if (users.length === 0) {
                listDiv.innerHTML = `<div class="alert alert-info text-center">No users found in database.</div>`;
                return;
            }

            users.forEach(user => {
                const initial = user.firstName ? user.firstName[0].toUpperCase() : '?';
                listDiv.innerHTML += `
                    <div class="user-card d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle">${initial}</div>
                            <div>
                                <strong class="d-block">${user.firstName} ${user.lastName || ''}</strong>
                                <span class="text-muted small">${user.email}</span>
                            </div>
                        </div>
                        <span class="badge bg-light text-dark border">Registered User</span>
                    </div>`;
            });
        } catch (err) {
            listDiv.innerHTML = `<div class="alert alert-danger">Error: ${err.message}. Make sure server is up!</div>`;
        }
    }
    loadPublicUsers();
  </script>
</body>
</html>
