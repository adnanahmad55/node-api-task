<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 | Registered Users Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; font-family: 'Segoe UI', sans-serif; }
    .directory-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    .avatar-circle { width: 35px; height: 35px; background: #0084ff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="directory-container">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="text-dark m-0 fw-bold">Registered User Directory (Task 2)</h2>
        <a href="index.html" class="btn btn-outline-primary shadow-sm">Go to Login</a>
    </div>
    
    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="publicUserList">
                <tr>
                    <td colspan="4" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Checking API connection...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div id="debugInfo" style="font-size: 10px; color: #ccc; margin-top: 20px;"></div>
  </div>

  <script>
    async function loadPublicUsers() {
        const listBody = document.getElementById('publicUserList');
        const debug = document.getElementById('debugInfo');
        
        // 🔥 ABSOLUTE URL use kar rahe hain taaki koi confusion na rahe
        const apiUrl = "https://node-api-task-nl8e.onrender.com/api/chat/all-registered";
        
        try {
            debug.innerText = "Attempting to fetch from: " + apiUrl;
            const res = await fetch(apiUrl);
            
            if (!res.ok) throw new Error("Server responded with status: " + res.status);
            
            const users = await res.json();
            console.log("Success! Users found:", users);

            if (!Array.isArray(users)) {
                listBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: API didn't return a list.</td></tr>`;
                return;
            }

            if (users.length === 0) {
                listBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">No users in database.</td></tr>`;
                return;
            }

            listBody.innerHTML = "";
            users.forEach((user, index) => {
                const initial = user.firstName ? user.firstName[0].toUpperCase() : '?';
                const fullName = (user.firstName || '') + " " + (user.lastName || '');
                
                listBody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle me-2">${initial}</div>
                                <span>${fullName}</span>
                            </div>
                        </td>
                        <td><span class="text-primary">${user.email}</span></td>
                        <td><span class="badge bg-success">Registered</span></td>
                    </tr>`;
            });
            debug.innerText = "Fetch complete. Loaded " + users.length + " users.";

        } catch (err) {
            console.error("Critical Fetch Error:", err);
            listBody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-4">
                        <div class="alert alert-danger mb-0">
                            <strong>Fetch Failed:</strong> ${err.message}<br>
                            <small>Check if your Render server is sleeping.</small>
                        </div>
                    </td>
                </tr>`;
            debug.innerText = "Error details: " + err.stack;
        }
    }
    loadPublicUsers();
  </script>
</body>
</html>
