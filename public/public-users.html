<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 | Registered Users Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; padding: 40px 20px; }
    .directory-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .user-card { border: 1px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 12px; transition: 0.2s; }
    .user-card:hover { background-color: #f8f9fa; border-color: #0084ff; }
    .avatar-circle { width: 45px; height: 45px; background: #0084ff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; margin-right: 15px; }
  </style>
</head>
<body>
  <div class="directory-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary m-0">Registered Users (Public)</h2>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Back to Login</a>
    </div>
    
    <div id="publicUserList">
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Fetching public directory...</p>
        </div>
    </div>
  </div>

  <script>
    async function loadPublicUsers() {
        const listDiv = document.getElementById('publicUserList');
        try {
            // 🔥 FIXED URL: Aapke chatRoutes.js se match karne ke liye
            const res = await fetch('/api/chat/all-registered');
            const users = await res.json();
            
            if (!Array.isArray(users)) throw new Error("Invalid response format");

            listDiv.innerHTML = "";
            if (users.length === 0) {
                listDiv.innerHTML = `<div class="alert alert-info text-center">No users registered yet.</div>`;
                return;
            }

            users.forEach(user => {
                const initial = user.firstName ? user.firstName[0].toUpperCase() : '?';
                const fullName = `${user.firstName} ${user.lastName || ''}`;
                const regDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A';

                listDiv.innerHTML += `
                    <div class="user-card d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle">${initial}</div>
                            <div>
                                <strong class="d-block text-dark">${fullName}</strong>
                                <span class="text-muted small">${user.email}</span>
                            </div>
                        </div>
                        <div class="text-end">
                            <span class="badge bg-light text-dark border">Joined: ${regDate}</span>
                        </div>
                    </div>`;
            });
        } catch (err) {
            console.error("Fetch Error:", err);
            listDiv.innerHTML = `
                <div class="alert alert-danger text-center">
                    <strong>Error:</strong> Failed to load users. Please check if your server is running.
                </div>`;
        }
    }
    loadPublicUsers();
  </script>
</body>
</html>
