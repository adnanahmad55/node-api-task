<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Public User Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; padding: 50px; }
    .user-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-primary">All Registered Users (Public List)</h2>
    <div id="publicUserList">Loading users...</div>
  </div>

  <script>
    async function loadPublicUsers() {
        const listDiv = document.getElementById('publicUserList');
        try {
            // Humne naya context-free route call kiya
            const res = await fetch('/api/chat/public-all');
            const users = await res.json();
            
            listDiv.innerHTML = "";
            users.forEach(user => {
                listDiv.innerHTML += `
                    <div class="user-card d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${user.firstName} ${user.lastName || ''}</strong><br>
                            <span class="text-muted small">${user.email}</span>
                        </div>
                        <span class="badge bg-secondary">Registered: ${new Date(user.createdAt).toLocaleDateString()}</span>
                    </div>`;
            });
        } catch (err) {
            listDiv.innerHTML = "Error loading users.";
        }
    }
    loadPublicUsers();
  </script>
</body>
</html>
