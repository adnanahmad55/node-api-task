<!DOCTYPE html>
<html>
<head>
  <title>User List</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="table-container">

  <div class="nav">
    <a href="index.html">Add New User</a>
    <span></span>
  </div>

  <h2>Registered Users</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Email</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <p id="msg" style="text-align:center; margin-top:10px;"></p>
</div>

<script>
$(document).ready(function(){

  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/all", // ✅ RENDER URL
    type: "GET",

    success: function (data) {
      $("#userTable").html("");

      if (!data || data.length === 0) {
        $("#msg").css("color", "orange").text("No users found");
        return;
      }

      data.forEach(user => {
        $("#userTable").append(`
          <tr>
            <td>${user.firstName} ${user.lastName}</td>
            <td>${user.mobile}</td>
            <td>${user.email}</td>
            <td>${user.address?.city || "-"}</td>
          </tr>
        `);
      });
    },

    error: function (err) {
      console.error(err);
      $("#msg")
        .css("color", "red")
        .text("Failed to load users");
    }
  });

});
</script>

</body>
</html>
