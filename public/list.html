<!DOCTYPE html>
<html>
<head>
  <title>User Directory | Registered Users</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* Table layout improvements for better resolution */
    .table-container {
      width: 90%;
      margin: 30px auto;
      max-width: 1000px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: #0084ff;
      color: white;
      padding: 15px;
      text-align: left;
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .nav {
      margin-bottom: 20px;
      text-align: right;
    }

    .nav a {
      background: #fa3e3e;
      color: white;
      padding: 8px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="table-container">

  <div class="nav">
    <a href="chat.html" style="background: #0084ff; margin-right: 10px;">Go to Messenger</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </div>

  <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Registered User Directory</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Email</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody id="userTable">
      </tbody>
  </table>

  <p id="msg" style="text-align:center; margin-top:10px;"></p>

</div>

<script>
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  
  // Security Check: Bina login ke list bhi nahi dikhni chahiye
  if (!loggedUser || !loggedUser.email) {
    window.location.href = "index.html";
  }

  $(document).ready(function () {
    // API call to fetch all users
    $.get("https://node-api-task-nl8e.onrender.com/api/users/all", function (data) {
        $("#userTable").html("");

        if (data.length === 0) {
            $("#userTable").append('<tr><td colspan="4" style="text-align:center">No users found</td></tr>');
            return;
        }

        data.forEach(user => {
            // Self-account ko list mein dikhane ki zarurat nahi hai
            if (user.email !== loggedUser.email) {
                $("#userTable").append(`
                  <tr>
                    <td><strong>${user.firstName} ${user.lastName}</strong></td>
                    <td>${user.mobile || "-"}</td>
                    <td>${user.email}</td>
                    <td>${user.address?.city || "-"}</td>
                  </tr>
                `);
            }
        });
      }
    ).fail(function() {
        $("#msg").text("Failed to load users. Please check server connection.").css("color", "red");
    });
  });

  function logout() {
    localStorage.clear();
    window.location.href = "index.html";
  }
</script>

</body>
</html>
