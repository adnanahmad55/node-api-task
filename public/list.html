<!DOCTYPE html>
<html>
<head>
  <title>User List</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .live-box {
      margin-top: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
    .live-user {
      cursor: pointer;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    .live-user:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<div class="table-container">

  <div class="nav">
    <a href="index.html">Add / Login User</a>
  </div>

  <h2>Registered Users</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Email</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <p id="msg" style="text-align:center; margin-top:10px;"></p>

  <!-- 🔥 LIVE USERS -->
  <div class="live-box">
    <h3>Live Connected Users</h3>
    <div id="liveUsers"></div>
  </div>

</div>

<!-- SOCKET.IO -->
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io("https://node-api-task-nl8e.onrender.com");

  // ✅ GET LOGGED USER
  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));

  if (!loggedUser || !loggedUser.email) {
    window.location.href = "index.html";
  } else {
    // 🔥 JOIN SOCKET
    socket.emit("join", {
      email: loggedUser.email
    });
  }
</script>

<script>
/* ======================
   LOAD ALL USERS
====================== */
$(document).ready(function () {
  $.ajax({
    url: "https://node-api-task-nl8e.onrender.com/api/users/all",
    type: "GET",

    success: function (data) {
      $("#userTable").html("");

      if (!data || data.length === 0) {
        $("#msg").css("color", "orange").text("No users found");
        return;
      }

      data.forEach(user => {
        $("#userTable").append(`
          <tr>
            <td>${user.firstName} ${user.lastName}</td>
            <td>${user.mobile}</td>
            <td>${user.email}</td>
            <td>${user.address?.city || "-"}</td>
          </tr>
        `);
      });
    },

    error: function () {
      $("#msg").css("color", "red").text("Failed to load users");
    }
  });
});

/* ======================
   LIVE USERS FROM SOCKET
====================== */
socket.on("live_users_list", function (emails) {
  const container = $("#liveUsers");
  container.html("");

  if (!emails || emails.length === 0) {
    container.html("<p>No live users</p>");
    return;
  }

  emails.forEach(email => {
    if (email !== loggedUser.email) {
      container.append(`
        <div class="live-user" onclick="openChat('${email}')">
          <strong>${email}</strong>
        </div>
      `);
    }
  });
});

/* ======================
   OPEN CHAT PAGE
====================== */
function openChat(email) {
  window.location.href = `chat.html?email=${encodeURIComponent(email)}`;
}
</script>

</body>
</html>
