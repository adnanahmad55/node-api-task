<!DOCTYPE html>
<html>
<head>
  <title>User List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    .live-box {
      margin-top: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }

    .live-user {
      cursor: pointer;
      padding: 8px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-user:hover {
      background: #f0f0f0;
    }

    .chat-btn {
      padding: 5px 10px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .unread {
      background: red;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 50%;
      margin-left: 8px;
    }
  </style>
</head>

<body>

<div class="table-container">

  <div class="nav">
    <a href="index.html">Logout</a>
  </div>

  <h2>Registered Users</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Email</th>
        <th>City</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <p id="msg" style="text-align:center; margin-top:10px;"></p>

  <!-- 🔥 LIVE USERS -->
  <div class="live-box">
    <h3>Chats</h3>
    <div id="liveUsers"></div>
  </div>

</div>

<!-- SOCKET.IO -->
<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io("https://node-api-task-nl8e.onrender.com", {
    transports: ["websocket"]
  });

  const loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
  if (!loggedUser || !loggedUser.email) {
    window.location.href = "index.html";
  }

  // unread store
  const unreadCount = {};

  socket.emit("join", { email: loggedUser.email });

  /* ======================
     LOAD ALL USERS
  ====================== */
  $(document).ready(function () {
    $.get(
      "https://node-api-task-nl8e.onrender.com/api/users/all",
      function (data) {
        $("#userTable").html("");

        data.forEach(user => {
          if (user.email !== loggedUser.email) {
            $("#userTable").append(`
              <tr>
                <td>${user.firstName} ${user.lastName}</td>
                <td>${user.mobile}</td>
                <td>${user.email}</td>
                <td>${user.address?.city || "-"}</td>
                <td>
                  <button class="chat-btn"
                    onclick="openChat('${user.email}')">
                    Chat
                  </button>
                </td>
              </tr>
            `);
          }
        });
      }
    );
  });

  /* ======================
     LOAD CHAT USERS
  ====================== */
  function renderChatUser(email) {
    const badge = unreadCount[email]
      ? `<span class="unread">${unreadCount[email]}</span>`
      : "";

    return `
      <div class="live-user" onclick="openChat('${email}')">
        <span>💬 ${email}</span>
        ${badge}
      </div>
    `;
  }

  /* ======================
     SOCKET EVENTS
  ====================== */
  socket.on("live_users_list", function (emails) {
    const box = $("#liveUsers");
    box.html("");

    emails.forEach(email => {
      if (email !== loggedUser.email) {
        box.append(renderChatUser(email));
      }
    });
  });

  // 🔥 NEW MESSAGE COMING (WITHOUT OPEN CHAT)
  socket.on("receive_message", (data) => {
    const sender = data.senderEmail;

    unreadCount[sender] = (unreadCount[sender] || 0) + 1;

    refreshSidebar();
  });

  // 🔥 FORCE SIDEBAR REFRESH
  socket.on("sidebar_update", refreshSidebar);

  function refreshSidebar() {
    const box = $("#liveUsers");
    box.html("");

    Object.keys(unreadCount).forEach(email => {
      box.append(renderChatUser(email));
    });
  }

  /* ======================
     OPEN CHAT
  ====================== */
  function openChat(email) {
    unreadCount[email] = 0; // clear unread
    window.location.href =
      `chat.html?email=${encodeURIComponent(email)}`;
  }
</script>

</body>
</html>
